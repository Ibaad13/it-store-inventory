<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2457d6">
  <title>IT Store Inventory</title>
  <meta name="description" content="Search the IT Store inventory and see exactly which cabinet each asset is in.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232457d6'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h14' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="M7.5 9h9M7.5 12h9M7.5 15h5"/></svg>
    </span>
    <div>
      <h1>IT Store Inventory</h1>
      <p class="sub">Asset locator &amp; cabinet directory</p>
    </div>
  </div>

  <div class="actions">
    <nav class="tabs" role="tablist" aria-label="Sections">
      <span class="ind" aria-hidden="true"></span>
      <button role="tab" id="tab-map" data-tab="map" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span>Map</span></button>
      <button role="tab" id="tab-search" data-tab="search" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg><span>Search</span></button>
      <button role="tab" id="tab-info" data-tab="info" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span>Info</span></button>
    </nav>
    <button id="theme" class="themeBtn" type="button" aria-label="Switch light / dark theme">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>

<main>
  <!-- Key figures (filled by js/app.js) -->
  <section id="kpis" class="kpis" aria-label="Inventory overview"></section>

  <!-- MAP + SEARCH share the same room map -->
  <section id="stage" class="stage" aria-live="polite">
    <div class="mapCard">
      <div class="mapHead">
        <div>
          <h2>Store room layout</h2>
          <p class="mapHint" id="mapHint">Tap or click any cabinet to see what is inside it.</p>
        </div>
        <ul class="legend" aria-label="Map legend">
          <li><i class="lg lg-cab"></i>Cabinet</li>
          <li><i class="lg lg-empty"></i>No list yet</li>
          <li><i class="lg lg-proj"></i>Project</li>
          <li><i class="lg lg-match"></i>Match</li>
        </ul>
      </div>
      <div class="mapScroll">
        <svg id="map" viewBox="0 0 910 540" role="group" aria-label="Room layout with cabinets"></svg>
      </div>
      <p class="mapFoot" id="mapFoot"></p>
    </div>

    <aside id="side" class="side" hidden>
      <label class="searchBox" for="q">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search name, asset tag, keyword…" aria-label="Search the inventory">
        <button id="clear" type="button" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </label>
      <div id="results" class="results"></div>
    </aside>
  </section>

  <!-- INFO -->
  <section id="info" class="info" hidden></section>
</main>

<footer class="foot" id="foot"></footer>

<dialog id="modal" aria-labelledby="modalTitle">
  <div class="modalBody" id="modalBody"></div>
</dialog>

<script src="data/inventory.js"></script>
<script src="js/app.js"></script>
</body>
</html>
